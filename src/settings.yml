# Paste everything below into the plugin's "Form Fields" box on trmnl.com.
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,analytics
  github_url: https://github.com/Acollie/ukpowerusage
  description: >-
    Gas, wind, sunshine or a cable from France? A calm, stacked chart of where Great Britain's
    electricity is coming from (nuclear, wind, solar, bio/hydro, imports and gas), with a bold line
    for total demand on top. Pick a window from 6 hours to 3 days, show the top sources or a summary,
    and switch between GW and % share.<br><br>
    Free public data from Elexon, Sheffield Solar PV_Live and the Carbon Intensity API.
    No keys, no accounts.
- keyname: hours
  field_type: select
  name: Time window
  description: How far back the chart looks. The quadrant layout shows at most 12 hours.
  options:
  - 6 hours: 6
  - 12 hours: 12
  - 24 hours: 24
  - 2 days: 48
  - 3 days: 72
  default: 24
- keyname: header
  field_type: select
  name: Header
  description: What to show above the chart.
  options:
  - Top sources right now: top
  - Summary (GW now, peak, low carbon, carbon intensity): summary
  default: top
- keyname: units
  field_type: select
  name: Chart units
  description: GW stacks absolute generation with a total line. % share shows each source's share of the mix.
  options:
  - GW: gw
  - "% share": percent
  default: gw
- keyname: show_legend
  field_type: select
  name: Show legend
  options:
  - "Yes"
  - "No"
  default: "yes"
